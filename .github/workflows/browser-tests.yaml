name: Browser tests

on:
    push:
        branches:
            - main
            - '[0-9]+.[0-9]+'
    pull_request: ~

jobs:
    admin-ui:
        name: "Admin UI tests"
        uses: ibexa/gh-workflows/.github/workflows/browser-tests.yml@main
        with:
            project-edition: 'oss'
            test-setup-phase-1: '--profile=regression --suite=setup-oss --mode=standard'
            test-suite: "--mode=standard --profile=browser --suite=admin-ui-full --tags='~@broken&&~@IbexaDXP'"
            multirepository: true
            timeout: 40
        secrets: inherit
    examples:
        name: "BehatBundle examples"
        uses: ibexa/gh-workflows/.github/workflows/browser-tests.yml@main
        with:
            project-edition: 'oss'
            # Deliberately parallel mode (the ibexabehat default) so --list-scenarios and the fastest
            # runner are exercised — no other job covers that path. Pinned to a single process:
            # configuration.feature rewrites the app's config files while the other features boot the
            # same kernel, and the runner's CPU count must not decide how many do that at once.
            test-suite:  '--profile=service --suite=examples --process=1'
        secrets: inherit
